<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 480" width="950" height="480">
  <rect width="950" height="480" rx="14" fill="#030712" stroke="#1f2937" stroke-width="1.5"/>
  
  <!-- Header Table -->
  <rect x="0" y="0" width="950" height="45" fill="#0b0f19" stroke="#1f2937" stroke-width="1"/>
  <text x="30" y="28" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#9ca3af">#</text>
  <text x="70" y="28" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#9ca3af">PREGUNTA REALIZADA A LA IA</text>
  <text x="320" y="28" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#9ca3af">RESPUESTA OBTENIDA</text>
  <text x="540" y="28" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#9ca3af">¿SE USÓ?</text>
  <text x="630" y="28" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#9ca3af">MODIFICACIONES REALIZADAS</text>
  <text x="810" y="28" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#9ca3af">JUSTIFICACIÓN</text>

  <!-- Row 1: Diseño del nodo -->
  <line x1="0" y1="45" x2="950" y2="45" stroke="#1f2937" stroke-width="1"/>
  <text x="30" y="90" font-family="monospace" font-size="14" font-weight="bold" fill="#9ca3af">1</text>
  <circle cx="75" cy="75" r="3" fill="#6366f1"/>
  <text x="85" y="79" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Diseño del nodo</text>
  <text x="70" y="98" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">Estructura para palabras y</text>
  <text x="70" y="112" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">conteo de frecuencias de duplicados.</text>
  
  <text x="320" y="80" font-family="system-ui, sans-serif" font-size="10" fill="#cbd5e1">Clase Node con atributos word,</text>
  <text x="320" y="95" font-family="system-ui, sans-serif" font-size="10" fill="#cbd5e1">count, left, right y métodos booleanos.</text>

  <rect x="545" y="75" width="30" height="20" rx="10" fill="#064e3b"/>
  <text x="560" y="89" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#34d399">Sí</text>

  <text x="630" y="80" font-family="system-ui, sans-serif" font-size="10" fill="#cbd5e1">Estructura TypeScript con id,</text>
  <text x="630" y="95" font-family="system-ui, sans-serif" font-size="10" fill="#cbd5e1">rawWords, level y banderas directas.</text>

  <text x="810" y="80" font-family="system-ui, sans-serif" font-size="10" fill="#cbd5e1">Permite trazabilidad e inspección</text>
  <text x="810" y="95" font-family="system-ui, sans-serif" font-size="10" fill="#cbd5e1">visual directa sin recalcular.</text>

  <!-- Row 2: Inserción -->
  <line x1="0" y1="130" x2="950" y2="130" stroke="#1f2937" stroke-width="1"/>
  <text x="30" y="175" font-family="monospace" font-size="14" font-weight="bold" fill="#9ca3af">2</text>
  <circle cx="75" cy="160" r="3" fill="#6366f1"/>
  <text x="85" y="164" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Inserción</text>
  <text x="70" y="183" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">Inserción recursiva con</text>
  <text x="70" y="197" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">manejo de duplicados.</text>

  <text x="320" y="165" font-family="system-ui, sans-serif" font-size="10" fill="#cbd5e1">Función recursiva usando &lt; y &gt;,</text>
  <text x="320" y="180" font-family="system-ui, sans-serif" font-size="10" fill="#cbd5e1">descartando duplicados.</text>

  <rect x="545" y="160" width="30" height="20" rx="10" fill="#064e3b"/>
  <text x="560" y="174" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#34d399">Sí</text>

  <text x="630" y="165" font-family="system-ui, sans-serif" font-size="10" fill="#cbd5e1">Comparación con localeCompare('es')</text>
  <text x="630" y="180" font-family="system-ui, sans-serif" font-size="10" fill="#cbd5e1">y acumulador node.count += 1.</text>

  <text x="810" y="165" font-family="system-ui, sans-serif" font-size="10" fill="#cbd5e1">ASCII clasifica 'árbol' (225) tras</text>
  <text x="810" y="180" font-family="system-ui, sans-serif" font-size="10" fill="#cbd5e1">'zorro' (122). Frecuencia preserva ABB.</text>

  <!-- Row 3: Conteo de nodos -->
  <line x1="0" y1="215" x2="950" y2="215" stroke="#1f2937" stroke-width="1"/>
  <text x="30" y="260" font-family="monospace" font-size="14" font-weight="bold" fill="#9ca3af">3</text>
  <circle cx="75" cy="245" r="3" fill="#6366f1"/>
  <text x="85" y="249" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Conteo de nodos</text>
  <text x="70" y="268" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">Calcular nodos totales, hojas</text>
  <text x="70" y="282" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">y nodos internos.</text>

  <text x="320" y="250" font-family="system-ui, sans-serif" font-size="10" fill="#cbd5e1">3 funciones recursivas separadas:</text>
  <text x="320" y="265" font-family="system-ui, sans-serif" font-size="10" fill="#cbd5e1">countNodes, countLeaves, countInternal.</text>

  <rect x="545" y="245" width="30" height="20" rx="10" fill="#4c0519"/>
  <text x="560" y="259" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#fda4af">No</text>

  <text x="630" y="250" font-family="system-ui, sans-serif" font-size="10" fill="#cbd5e1">Función única calculateTreeMetrics()</text>
  <text x="630" y="265" font-family="system-ui, sans-serif" font-size="10" fill="#cbd5e1">en un solo recorrido O(n).</text>

  <text x="810" y="250" font-family="system-ui, sans-serif" font-size="10" fill="#cbd5e1">Llamar 3 funciones triplica el tiempo</text>
  <text x="810" y="265" font-family="system-ui, sans-serif" font-size="10" fill="#cbd5e1">O(3n). Unificarlo es óptimo.</text>

  <!-- Row 4: Casos de prueba -->
  <line x1="0" y1="300" x2="950" y2="300" stroke="#1f2937" stroke-width="1"/>
  <text x="30" y="345" font-family="monospace" font-size="14" font-weight="bold" fill="#9ca3af">4</text>
  <circle cx="75" cy="330" r="3" fill="#6366f1"/>
  <text x="85" y="334" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Casos de prueba</text>
  <text x="70" y="353" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">Batería de validación y</text>
  <text x="70" y="367" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">propuesta de casos límite.</text>

  <text x="320" y="335" font-family="system-ui, sans-serif" font-size="10" fill="#cbd5e1">Oraciones básicas con signos,</text>
  <text x="320" y="350" font-family="system-ui, sans-serif" font-size="10" fill="#cbd5e1">comas y palabras repetidas.</text>

  <rect x="545" y="330" width="30" height="20" rx="10" fill="#064e3b"/>
  <text x="560" y="344" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#34d399">Sí</text>

  <text x="630" y="335" font-family="system-ui, sans-serif" font-size="10" fill="#cbd5e1">Se integraron los 8 casos de rúbrica</text>
  <text x="630" y="350" font-family="system-ui, sans-serif" font-size="10" fill="#cbd5e1">+ 5 casos límite de la IA con pertinencia.</text>

  <text x="810" y="335" font-family="system-ui, sans-serif" font-size="10" fill="#cbd5e1">Comprueba solidez ante árboles</text>
  <text x="810" y="350" font-family="system-ui, sans-serif" font-size="10" fill="#cbd5e1">degenerados y cadenas vacías.</text>

  <!-- Row 5: Normalización en español -->
  <line x1="0" y1="385" x2="950" y2="385" stroke="#1f2937" stroke-width="1"/>
  <text x="30" y="430" font-family="monospace" font-size="14" font-weight="bold" fill="#9ca3af">5</text>
  <circle cx="75" cy="415" r="3" fill="#6366f1"/>
  <text x="85" y="419" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Normalización español</text>
  <text x="70" y="438" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">Limpieza sin eliminar la 'ñ'</text>
  <text x="70" y="452" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">ni vocales acentuadas.</text>

  <text x="320" y="420" font-family="system-ui, sans-serif" font-size="10" fill="#cbd5e1">Sugerencia inicial: replace(/[^a-zA-Z]/g),</text>
  <text x="320" y="435" font-family="system-ui, sans-serif" font-size="10" fill="#cbd5e1">lo que borraba tildes y la 'ñ'.</text>

  <rect x="545" y="415" width="30" height="20" rx="10" fill="#064e3b"/>
  <text x="560" y="429" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#34d399">Sí</text>

  <text x="630" y="420" font-family="system-ui, sans-serif" font-size="10" fill="#cbd5e1">Regex Unicode: /[^\p{L}\p{N}\s]/gu</text>
  <text x="630" y="435" font-family="system-ui, sans-serif" font-size="10" fill="#cbd5e1">para preservar el alfabeto completo.</text>

  <text x="810" y="420" font-family="system-ui, sans-serif" font-size="10" fill="#cbd5e1">Previene corrupción de palabras como</text>
  <text x="810" y="435" font-family="system-ui, sans-serif" font-size="10" fill="#cbd5e1">'árbol' en 'rbol' o 'ñandú' en 'and'.</text>
</svg>
