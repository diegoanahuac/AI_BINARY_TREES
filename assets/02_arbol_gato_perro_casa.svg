<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420">
  <defs>
    <radialGradient id="dots" cx="20%" cy="20%" r="5%">
      <stop offset="0%" stop-color="#334155" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>
  <!-- Background Canvas -->
  <rect width="800" height="420" rx="14" fill="#030712" stroke="#1f2937" stroke-width="1.5"/>
  
  <!-- Canvas Header -->
  <rect x="0" y="0" width="800" height="50" fill="#0b0f19" stroke="#1f2937" stroke-width="1"/>
  <rect x="20" y="15" width="105" height="22" rx="11" fill="#064e3b" stroke="#059669" stroke-width="1"/>
  <circle cx="32" cy="26" r="4" fill="#34d399"/>
  <text x="44" y="30" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#6ee7b7">ABB Activo</text>
  <text x="135" y="30" font-family="system-ui, sans-serif" font-size="12" fill="#9ca3af">3 nodos únicos</text>

  <rect x="350" y="12" width="230" height="26" rx="6" fill="#111827" stroke="#374151" stroke-width="1"/>
  <text x="365" y="29" font-family="system-ui, sans-serif" font-size="11" fill="#6b7280">🔍 Buscar palabra...</text>
  <rect x="590" y="12" width="55" height="26" rx="6" fill="#4f46e5"/>
  <text x="617" y="29" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#ffffff">Buscar</text>

  <!-- Edges -->
  <line x1="400" y1="130" x2="230" y2="240" stroke="#374151" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="400" y1="130" x2="570" y2="240" stroke="#374151" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Node Root: gato -->
  <g transform="translate(400, 130)">
    <circle r="32" fill="#312e81" stroke="#6366f1" stroke-width="2.5"/>
    <text text-anchor="middle" dy="5" font-family="system-ui, sans-serif" font-size="15" font-weight="bold" fill="#ffffff">gato</text>
    <rect x="-18" y="37" width="36" height="15" rx="7" fill="#4338ca"/>
    <text text-anchor="middle" y="48" font-family="system-ui, sans-serif" font-size="8" font-weight="bold" fill="#ffffff">RAÍZ</text>
  </g>

  <!-- Node Left: casa -->
  <g transform="translate(230, 240)">
    <circle r="32" fill="#064e3b" stroke="#10b981" stroke-width="2.5"/>
    <text text-anchor="middle" dy="5" font-family="system-ui, sans-serif" font-size="15" font-weight="bold" fill="#ffffff">casa</text>
    <rect x="-18" y="37" width="36" height="15" rx="7" fill="#047857"/>
    <text text-anchor="middle" y="48" font-family="system-ui, sans-serif" font-size="8" font-weight="bold" fill="#ffffff">HOJA</text>
  </g>

  <!-- Node Right: perro -->
  <g transform="translate(570, 240)">
    <circle r="32" fill="#064e3b" stroke="#10b981" stroke-width="2.5"/>
    <text text-anchor="middle" dy="5" font-family="system-ui, sans-serif" font-size="15" font-weight="bold" fill="#ffffff">perro</text>
    <rect x="-18" y="37" width="36" height="15" rx="7" fill="#047857"/>
    <text text-anchor="middle" y="48" font-family="system-ui, sans-serif" font-size="8" font-weight="bold" fill="#ffffff">HOJA</text>
  </g>

  <!-- Legend -->
  <g transform="translate(30, 375)">
    <rect width="320" height="30" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <circle cx="20" cy="15" r="5" fill="#4f46e5"/>
    <text x="32" y="19" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Raíz</text>
    
    <circle cx="85" cy="15" r="5" fill="#7c3aed"/>
    <text x="97" y="19" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Nodo Interno</text>
    
    <circle cx="190" cy="15" r="5" fill="#10b981"/>
    <text x="202" y="19" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Hoja</text>
    
    <circle cx="255" cy="15" r="5" fill="#f43f5e"/>
    <text x="267" y="19" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Duplicado (×N)</text>
  </g>
</svg>
