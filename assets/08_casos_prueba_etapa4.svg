<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" width="900" height="450">
  <rect width="900" height="450" rx="14" fill="#030712" stroke="#1f2937" stroke-width="1.5"/>
  
  <!-- Left Column: Test Cases List -->
  <g transform="translate(20, 20)">
    <text x="0" y="15" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">Batería de Pruebas Automatizadas</text>
    
    <!-- Item 1 -->
    <rect x="0" y="30" width="410" height="65" rx="8" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5"/>
    <rect x="10" y="40" width="48" height="18" rx="4" fill="#312e81"/>
    <text x="34" y="52" text-anchor="middle" font-family="monospace" font-size="9" font-weight="bold" fill="#a5b4fc">CASO 1</text>
    <text x="65" y="53" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#ffffff">Inserción y recorridos</text>
    <rect x="340" y="40" width="60" height="18" rx="9" fill="#064e3b"/>
    <text x="370" y="52" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" fill="#34d399">✔ Pasado</text>
    <text x="10" y="78" font-family="monospace" font-size="10" fill="#cbd5e1">"gato perro casa"</text>

    <!-- Item 2 -->
    <rect x="0" y="105" width="410" height="65" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <rect x="10" y="115" width="48" height="18" rx="4" fill="#1e293b"/>
    <text x="34" y="127" text-anchor="middle" font-family="monospace" font-size="9" font-weight="bold" fill="#94a3b8">CASO 2</text>
    <text x="65" y="128" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#ffffff">Orden alfabético (Tildes)</text>
    <rect x="340" y="115" width="60" height="18" rx="9" fill="#064e3b"/>
    <text x="370" y="127" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" fill="#34d399">✔ Pasado</text>
    <text x="10" y="153" font-family="monospace" font-size="10" fill="#cbd5e1">"zorro árbol abeja"</text>

    <!-- Item 3 -->
    <rect x="0" y="180" width="410" height="65" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <rect x="10" y="190" width="48" height="18" rx="4" fill="#1e293b"/>
    <text x="34" y="202" text-anchor="middle" font-family="monospace" font-size="9" font-weight="bold" fill="#94a3b8">CASO 3</text>
    <text x="65" y="203" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#ffffff">Árbol con un nodo</text>
    <rect x="340" y="190" width="60" height="18" rx="9" fill="#064e3b"/>
    <text x="370" y="202" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" fill="#34d399">✔ Pasado</text>
    <text x="10" y="228" font-family="monospace" font-size="10" fill="#cbd5e1">"computadora"</text>

    <!-- Item 4 -->
    <rect x="0" y="255" width="410" height="65" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <rect x="10" y="265" width="48" height="18" rx="4" fill="#1e293b"/>
    <text x="34" y="277" text-anchor="middle" font-family="monospace" font-size="9" font-weight="bold" fill="#94a3b8">CASO 4</text>
    <text x="65" y="278" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#ffffff">Tratamiento de duplicados</text>
    <rect x="340" y="265" width="60" height="18" rx="9" fill="#064e3b"/>
    <text x="370" y="277" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" fill="#34d399">✔ Pasado</text>
    <text x="10" y="303" font-family="monospace" font-size="10" fill="#cbd5e1">"sol luna sol estrella luna sol"</text>

    <!-- Item 5 -->
    <rect x="0" y="330" width="410" height="65" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <rect x="10" y="340" width="48" height="18" rx="4" fill="#1e293b"/>
    <text x="34" y="352" text-anchor="middle" font-family="monospace" font-size="9" font-weight="bold" fill="#94a3b8">CASO 5</text>
    <text x="65" y="353" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#ffffff">Conteo de nodos únicos</text>
    <rect x="340" y="340" width="60" height="18" rx="9" fill="#064e3b"/>
    <text x="370" y="352" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" fill="#34d399">✔ Pasado</text>
    <text x="10" y="378" font-family="monospace" font-size="10" fill="#cbd5e1">"manzana pera uva sandia platano..."</text>
  </g>

  <!-- Right Column: Detail Panel -->
  <g transform="translate(460, 45)">
    <rect width="410" height="370" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <rect x="15" y="15" width="85" height="20" rx="10" fill="#312e81"/>
    <text x="57" y="29" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#a5b4fc">Caso Activo</text>
    <text x="110" y="30" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">Caso 1: Inserción y Recorridos</text>

    <!-- Metric Mini Grid -->
    <rect x="15" y="55" width="85" height="50" rx="6" fill="#1e293b"/>
    <text x="57" y="73" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#94a3b8">PALABRAS</text>
    <text x="57" y="94" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">3</text>

    <rect x="115" y="55" width="85" height="50" rx="6" fill="#1e293b"/>
    <text x="157" y="73" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#94a3b8">NODOS</text>
    <text x="157" y="94" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#818cf8">3</text>

    <rect x="215" y="55" width="85" height="50" rx="6" fill="#1e293b"/>
    <text x="257" y="73" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#94a3b8">HOJAS/INT</text>
    <text x="257" y="94" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#34d399">2 / 1</text>

    <rect x="315" y="55" width="80" height="50" rx="6" fill="#1e293b"/>
    <text x="355" y="73" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#94a3b8">ALTURA</text>
    <text x="355" y="94" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#fbbf24">2</text>

    <!-- Traversals box -->
    <rect x="15" y="125" width="380" height="130" rx="8" fill="#020617" stroke="#1e293b" stroke-width="1"/>
    
    <text x="25" y="150" font-family="monospace" font-size="11" font-weight="bold" fill="#34d399">Inorden:</text>
    <text x="100" y="150" font-family="monospace" font-size="11" fill="#cbd5e1">casa → gato → perro</text>

    <text x="25" y="185" font-family="monospace" font-size="11" font-weight="bold" fill="#818cf8">Preorden:</text>
    <text x="100" y="185" font-family="monospace" font-size="11" fill="#94a3b8">gato → casa → perro</text>

    <text x="25" y="220" font-family="monospace" font-size="11" font-weight="bold" fill="#c084fc">Postorden:</text>
    <text x="100" y="220" font-family="monospace" font-size="11" fill="#94a3b8">casa → perro → gato</text>

    <!-- Verification message -->
    <rect x="15" y="275" width="380" height="75" rx="8" fill="#172554" stroke="#1e40af" stroke-width="1"/>
    <text x="25" y="295" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#93c5fd">✔ Resultado Comprobado:</text>
    <text x="25" y="315" font-family="system-ui, sans-serif" font-size="10" fill="#bfdbfe">La raíz es "gato". "casa" es menor (izq), "perro" es mayor (der).</text>
    <text x="25" y="332" font-family="system-ui, sans-serif" font-size="10" fill="#bfdbfe">Inorden alfabético estricto: casa → gato → perro.</text>
  </g>
</svg>
