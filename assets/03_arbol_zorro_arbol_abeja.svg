<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420">
  <rect width="800" height="420" rx="14" fill="#030712" stroke="#1f2937" stroke-width="1.5"/>
  
  <!-- Header -->
  <rect x="0" y="0" width="800" height="50" fill="#0b0f19" stroke="#1f2937" stroke-width="1"/>
  <rect x="20" y="15" width="105" height="22" rx="11" fill="#064e3b" stroke="#059669" stroke-width="1"/>
  <circle cx="32" cy="26" r="4" fill="#34d399"/>
  <text x="44" y="30" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#6ee7b7">ABB Activo</text>
  <text x="135" y="30" font-family="system-ui, sans-serif" font-size="12" fill="#9ca3af">3 nodos únicos (Orden con Tilde)</text>

  <!-- Edges -->
  <line x1="500" y1="120" x2="350" y2="210" stroke="#374151" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="350" y1="210" x2="200" y2="300" stroke="#374151" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Node Root: zorro -->
  <g transform="translate(500, 120)">
    <circle r="32" fill="#312e81" stroke="#6366f1" stroke-width="2.5"/>
    <text text-anchor="middle" dy="5" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">zorro</text>
    <rect x="-18" y="37" width="36" height="15" rx="7" fill="#4338ca"/>
    <text text-anchor="middle" y="48" font-family="system-ui, sans-serif" font-size="8" font-weight="bold" fill="#ffffff">RAÍZ</text>
  </g>

  <!-- Node Internal: árbol -->
  <g transform="translate(350, 210)">
    <circle r="32" fill="#2e1065" stroke="#8b5cf6" stroke-width="2.5"/>
    <text text-anchor="middle" dy="5" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">árbol</text>
    <rect x="-24" y="37" width="48" height="15" rx="7" fill="#6d28d9"/>
    <text text-anchor="middle" y="48" font-family="system-ui, sans-serif" font-size="8" font-weight="bold" fill="#ffffff">INTERNO</text>
  </g>

  <!-- Node Leaf: abeja -->
  <g transform="translate(200, 300)">
    <circle r="32" fill="#064e3b" stroke="#10b981" stroke-width="2.5"/>
    <text text-anchor="middle" dy="5" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">abeja</text>
    <rect x="-18" y="37" width="36" height="15" rx="7" fill="#047857"/>
    <text text-anchor="middle" y="48" font-family="system-ui, sans-serif" font-size="8" font-weight="bold" fill="#ffffff">HOJA</text>
  </g>

  <!-- Annotation Note -->
  <g transform="translate(480, 250)">
    <rect width="280" height="70" rx="8" fill="#1e1b4b" stroke="#4f46e5" stroke-width="1"/>
    <text x="15" y="24" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#a5b4fc">✔ Verificación de Regla Española:</text>
    <text x="15" y="42" font-family="system-ui, sans-serif" font-size="10" fill="#cbd5e1">"árbol" se ordena a la izquierda de "zorro"</text>
    <text x="15" y="58" font-family="system-ui, sans-serif" font-size="10" fill="#cbd5e1">Inorden alfabético: abeja → árbol → zorro</text>
  </g>
</svg>
